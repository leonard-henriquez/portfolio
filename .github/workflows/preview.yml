name: Preview

# Every pull request is built and deployed to Cloudflare Pages, on a URL of its own that follows the PR's branch
# (<branch>.<project>.pages.dev, updated on every push). A comment on the PR links to it.
# Production stays on GitHub Pages (deploy.yml). One-time setup: README.md, "Previews".

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# One deployment per PR at a time; a newer push replaces the one in progress.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The Cloudflare Pages project (created on the first run if it doesn't exist).
  PROJECT: hqz-me

jobs:
  preview:
    # Pull requests from forks get no secrets: nothing to deploy with.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check the Cloudflare credentials
        id: credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No preview: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (README.md, \"Previews\")."
          fi

      - uses: actions/checkout@v7
        if: steps.credentials.outputs.ready

      - uses: pnpm/action-setup@v4
        if: steps.credentials.outputs.ready
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.ready
        with:
          # Astro needs a recent Node 22 or later.
          node-version: 24
          cache: pnpm

      - name: Build
        if: steps.credentials.outputs.ready
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Create the Pages project if needed
        if: steps.credentials.outputs.ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! pnpm dlx wrangler@4 pages project list | grep -q " $PROJECT "; then
            pnpm dlx wrangler@4 pages project create "$PROJECT" --production-branch main
          fi

      - name: Deploy
        id: deploy
        if: steps.credentials.outputs.ready
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=${{ env.PROJECT }} --branch=${{ github.head_ref }} --commit-hash=${{ github.event.pull_request.head.sha }}

      - name: Link the preview on the PR
        if: steps.credentials.outputs.ready
        uses: actions/github-script@v7
        env:
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            // One comment per PR, updated on every push.
            const marker = "<!-- preview-deployment -->";
            const { ALIAS, URL, SHA } = process.env;
            const site = ALIAS || URL;
            const body = [
              marker,
              `**Preview:** ${site}`,
              "",
              `Themes: [Contemplation](${site}/?theme=contemplation) · [Minimal](${site}/?theme=minimal) · [Terminal](${site}/?theme=terminal)`,
              "",
              `This commit: ${URL} (${SHA.slice(0, 7)})`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((c) => c.user.type === "Bot" && c.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
