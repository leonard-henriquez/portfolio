        - title: Head of Engineering
          type: permanent
          start: "2020-08"
          end: "2022-08"
          text: "Ran engineering: a team of about 10 developers, including recruiting and training."
          skills: [SaaS, Full-stack development]
        - title: Product Manager
          type: permanent
          start: "2019-09"
          end: "2020-08"
    - org: BTU Protocol
      roles:
        - title: Product Manager
          type: freelance
          start: "2018-07"
