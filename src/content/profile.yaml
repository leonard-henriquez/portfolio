# Everything about Léonard that is not a project. One entry, keyed `leonard`.
# Themes never read this file: they get it resolved from getPortfolio() (src/lib/portfolio.ts).
# The full CV (every role, every school) lives on LinkedIn only, so the two can never disagree. What matters of it
# is told in `about`.

leonard:
  name: Léonard Henriquez
  handle: hqz
  location:
    city: Paris
    country: France
  roles: [Founder, Engineer]
  headline: I build the infrastructure AI agents run on.
  intro: "I build the infrastructure AI agents run on: durable execution, context, search and orchestration."
  focusAreas: [Durable execution, Context, Search, Orchestration]

  # The current role. `project` is a file name in src/content/projects/.
  current:
    title: Co-founder & CTO
    org: Topo
    detail: YC W24
    href: https://www.topo.io
    since: 2022
    highlight: Our AI SDR went from $0 to $1M ARR in three months.
    project: topo

  about:
    short: Coding since twelve, then business school and product. Co-founder and CTO of Topo (YC W24), where our AI SDR went from $0 to $1M ARR in three months.
    long:
      - I like to see the whole landscape (market, architecture, team) before choosing the path through it. Before Topo I was Head of Engineering at Manda, where I ran a team of about ten developers, after starting there as a product manager. MSc in Data Analytics and AI from EDHEC.
      - My work sits underneath AI agents, in the parts nobody demos. Durable execution that survives a crash at 3 a.m. Search built for machines that read faster than we do. Control planes that keep a fleet of coding agents honest.
    facts:
      - Coding since I was 12.
      - Based in Paris.

  numbers:
    - value: $1M ARR
      label: three months after launching our AI SDR
    - value: 80 → 318
      label: merged PRs per month (×4) with the same five-person team, after moving to coding agents
    - value: −63%
      label: bugs per change while releasing four times more
    - value: < 10h p80
      label: from customer feedback to production

  # What releasing agents to real customers taught me. Published in every theme and in the Markdown for LLMs.
  principles:
    - title: Agents are distributed systems
      body: A run is a long-lived workflow calling slow models and flaky APIs. It needs durable execution, retries, idempotent steps and replay.
    - title: Context beats prompts
      body: "Most quality gains came from what the model sees: CRM history, call transcripts, the right tools at the right step. Evals tell whether a change helped."
    - title: Autonomy is earned with feedback
      body: "Fast checks let agents catch their own mistakes: strict CI for coding agents, human review wherever a mistake is expensive."

  # Talks, juries and recognition. `year` is optional.
  talks:
    - year: 2024
      text: Y Combinator W24
    - year: 2024
      text: "Talk: LangGraph in production"
    - year: 2024
      text: Judge, Mistral AI hackathon, San Francisco
    - year: 2025
      text: Invited to the Élysée to help prepare the AI Action Summit

  # Framing text for page sections, all optional. `intro` introduces a section; `summary` is a one-line
  # teaser (e.g. in navigation) and falls back to `intro`.
  sections:
    explorations:
      intro: Questions I am working through, mostly on what infrastructure should look like once agents are its main users. Specs and architecture, not released products.
    principles:
      summary: What production agents taught me.
    talks:
      summary: Recognition.

  # No email address on the site, on purpose: `preferred` (a `kind` from `links`) is the one channel every theme
  # puts forward, introduced by `intro`.
  contact:
    intro: Building AI agents for production, or about to? I'm always happy to compare notes.
    preferred: linkedin
    links:
      - label: GitHub
        href: https://github.com/leonard-henriquez
        kind: github
      - label: LinkedIn
        href: https://www.linkedin.com/in/leonard-henriquez/
        kind: linkedin

  seo:
    title: Léonard Henriquez — AI agent infrastructure
    description: "Co-founder & CTO of Topo (YC W24). I build the infrastructure AI agents run on: durable execution, context, search and orchestration."

  heroImage:
    src: ../assets/wanderer.png
    alt: Caspar David Friedrich's Wanderer above the Sea of Fog, rendered as a dithered pixel image
    credit:
      artist: Caspar David Friedrich
      title: Wanderer above the Sea of Fog
      year: 1818
